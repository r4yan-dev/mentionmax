<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/brand/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mentionmax-app</title>
    <script>
      window.MathJax = {
        startup: { typeset: false },
        tex: {
          inlineMath: [["$", "$"], ["\\(", "\\)"]],
          displayMath: [["$$", "$$"], ["\\[", "\\]"]],
          processEscapes: true,
          processEnvironments: true
        },
        svg: { fontCache: "global" }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        function installMathJaxObserver() {
          if (!window.MathJax || !window.MathJax.typesetPromise) return;
          var root = document.getElementById("root");
          if (!root) return;
          var observer;
          var scheduled = false;
          var typeset = function () {
            scheduled = false;
            observer.disconnect();
            window.MathJax.typesetPromise([root]).catch(function () {}).finally(function () {
              observer.observe(root, { childList: true, subtree: true, characterData: true });
            });
          };
          var schedule = function () {
            if (scheduled) return;
            scheduled = true;
            window.requestAnimationFrame(typeset);
          };
          observer = new MutationObserver(schedule);
          observer.observe(root, { childList: true, subtree: true, characterData: true });
          schedule();
        }
        if (window.MathJax && window.MathJax.startup) {
          window.MathJax.startup.promise.then(installMathJaxObserver);
        } else {
          window.addEventListener("load", installMathJaxObserver, { once: true });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
